spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:support}
    username: ${POSTGRES_USER:support}
    password: ${POSTGRES_PASSWORD:change-me}
  jackson:
    deserialization:
      # A float in an integer field (for example "version": 0.9) is an unreadable body (400), not
      # silently truncated.
      accept-float-as-int: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

springdoc:
  # Error responses are declared per operation (ADR-008), not derived from the exception handlers.
  override-with-generic-response: false
  # The controllers declare no produces; success responses are JSON.
  default-produces-media-type: application/json
  # Sorted keys keep the spec deterministic.
  writer-with-order-by-keys: true

app:
  jwt:
    # The signing key has no default here: set APP_JWT_SECRET (Base64, at least 32 random bytes).
    # Startup fails if it is missing or too short.
    ttl: 60m
    issuer: support-backend
